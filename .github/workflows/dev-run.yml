name: dev-run

# Produces artifacts/ on a machine that meets the runner's requirements: the
# standard GitHub runner gives 4 vCPU, 16 GB RAM and ~14 GB of disk.
#
# The model is a local Ollama instance fronted by the kit's LiteLLM proxy, which
# is the sanctioned local path: eval/run.py refuses --model-base-url while
# submission.yaml declares a google-cloud/* model, and tells you to point
# MODEL_PROXY_URL at your server instead. The proxy maps the declared id onto the
# local model, so the harness still asks for google-cloud/llama-4-maverick.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "comma-separated dev task ids"
        required: true
        default: "roof-deck-design"
      model:
        description: "ollama model tag served behind the proxy"
        required: true
        default: "qwen2.5:1.5b"

permissions:
  contents: write

jobs:
  run:
    name: run dev tasks
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODEL_PROXY_KEY: ci-proxy-key
      MODEL_PROXY_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start the local model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > "$HOME/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break
            sleep 2
          done
          ollama pull "${{ inputs.model }}"
          ollama list

      - name: Start the model proxy
        run: |
          cat > "$RUNNER_TEMP/proxy.yaml" <<'YAML'
          model_list:
            - model_name: llama-4-maverick
              litellm_params: {model: ollama_chat/${{ inputs.model }}, api_base: http://127.0.0.1:11434}
            - model_name: google-cloud/llama-4-maverick
              litellm_params: {model: ollama_chat/${{ inputs.model }}, api_base: http://127.0.0.1:11434}
          litellm_settings:
            drop_params: true
            num_retries: 1
            request_timeout: 900
          general_settings:
            master_key: os.environ/MODEL_PROXY_KEY
          YAML
          python -m pip install --quiet 'litellm[proxy]'
          nohup litellm --config "$RUNNER_TEMP/proxy.yaml" --host 0.0.0.0 --port 4000 \
            > "$HOME/proxy.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H "Authorization: Bearer $MODEL_PROXY_KEY" http://127.0.0.1:4000/v1/models > /dev/null && break
            sleep 2
          done
          curl -s -H "Authorization: Bearer $MODEL_PROXY_KEY" http://127.0.0.1:4000/v1/models | head -c 400

      - name: Fetch the benchmark
        run: git clone --depth 1 https://github.com/google-research/ple "$RUNNER_TEMP/ple"

      - name: Check dataset access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN is not set. The dataset is gated: accept the terms at"
            echo "::error::https://huggingface.co/datasets/google/physical-engineerings-last-exam"
            echo "::error::then add a read token as the repository secret HF_TOKEN."
            exit 1
          fi
          # Probe a real file, not the listing. The metadata tree answers 200 even
          # for an account without access, which is exactly how this was missed.
          code=$(curl -sL -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/datasets/google/physical-engineerings-last-exam/resolve/main/.gitattributes)
          echo "dataset blob with token: HTTP $code"
          case "$code" in
            200) ;;
            401) echo "::error::The token was rejected. Check that it is a read token for the granted account."; exit 1 ;;
            403) echo "::error::The token is valid but the account has no access to this gated dataset."
                 echo "::error::Open https://huggingface.co/datasets/google/physical-engineerings-last-exam signed in,"
                 echo "::error::click 'Agree and access repository', then re-dispatch."
                 exit 1 ;;
            *)   echo "::error::Dataset blob fetch returned HTTP $code."; exit 1 ;;
          esac

      - name: Run the dev tasks
        working-directory: ${{ runner.temp }}/ple
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv tool install harbor==0.20.0 --with websockets
          # No --out: the run directory must sit outside the submission, and the
          # default (runs/<name>-<time> inside the benchmark clone) already does.
          # Artifacts are exported to $GITHUB_WORKSPACE/artifacts regardless.
          uv run python -m eval.run "$GITHUB_WORKSPACE" \
            --tasks "${{ inputs.tasks }}" \
            --trials 1 \
            --attempts 1

      - name: Collect logs
        if: always()
        run: |
          mkdir -p run-logs
          cp "$HOME/proxy.log" run-logs/ 2>/dev/null || true
          cp "$HOME/ollama.log" run-logs/ 2>/dev/null || true
          find "$RUNNER_TEMP/ple/runs" -maxdepth 2 -type f 2>/dev/null | head -50 |
            while read -r f; do cp "$f" "run-logs/$(basename "$(dirname "$f")")-$(basename "$f")"; done
          ls -la run-logs

      - name: Show what was produced
        if: always()
        run: |
          echo '--- proxy log tail ---'; tail -20 "$HOME/proxy.log" 2>/dev/null || true
          echo '--- runs ---'; ls -la runs 2>/dev/null | tail -5 || true
          echo '--- artifacts ---'; ls -la artifacts 2>/dev/null || echo 'no artifacts/'
          head -c 1200 artifacts/manifest.json 2>/dev/null || true

      - name: Keep the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-out
          path: |
            artifacts
            run-logs
          if-no-files-found: warn

      - name: Commit artifacts
        if: success()
        run: |
          git config user.name "dev-run"
          git config user.email "dev-run@users.noreply.github.com"
          git add -A artifacts
          if git diff --cached --quiet; then
            echo "no artifacts to commit"
          else
            git commit -m "artifacts: dev run of ${{ inputs.tasks }} on ${{ inputs.model }}"
            git push
          fi
