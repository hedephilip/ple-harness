name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit and protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one runtime dependency
        # requirements.txt is deliberately one line: the kit installs exactly
        # this inside a build with no container internet.
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Protocol end-to-end (reject, repair, pass over a real WebSocket)
        run: python tests/e2e_local.py

      - name: Writeup field limits and description drift
        run: python scripts/check_writeup.py

      # Stage 1 minimum requirements. Informational while artifacts/ is
      # absent: the repository cannot satisfy that row until the dev set has
      # been run, and a permanently red build would hide new failures.
      - name: Submission readiness (informational)
        continue-on-error: true
        run: python scripts/check_submission.py
