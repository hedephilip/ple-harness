name: gated-harness

# MODEL CHOICE — this is the single largest lever in the competition, and it is
# a one-line change. PLE paper Table 5 / §5.2, mean of three runs, 85 tasks:
#
#   claude-opus-5-5        50.6%   $17.18/task   <- best sponsored model
#   gemini-4-argon         43.2%   $ 8.21/task
#   gemini-3.8-flash       28.2%   $ 2.55/task
#   glm-5.2                25.3%   (median of all configs is 25.7%)
#   gemini-3.1-pro-preview 14.2%   (lowest of the sponsored models)
#   llama-4-maverick       <7%
#
# Declared model for Stage 2 evaluation. Claude Opus 5.5 is the top-performing
# sponsored model on the benchmark (50.6% baseline vs <7% for open-weight 17B,
# paper Table 5). The harness client (llm.py) is tailored specifically for it:
# no sampling parameters, automatic cache_control breakpoints, and 32k max tokens.
model_api: google-cloud/claude-opus-5-5

install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt

serve: /opt/harness/venv/bin/python {src}/serve.py

env:
  LOG_LEVEL: "info"
  MAX_FIX_ROUNDS: "3"
  PLAYBOOK_PATH: "/tmp/playbook.jsonl"
  TELEMETRY_DIR: "/tmp/telemetry"
  PLE_GATE_MODE: "on"
