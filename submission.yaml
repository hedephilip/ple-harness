name: gated-harness

# MODEL CHOICE — this is the single largest lever in the competition, and it is
# a one-line change. PLE paper Table 5 / §5.2, mean of three runs, 85 tasks:
#
#   claude-opus-5-5        50.6%   $17.18/task   <- best sponsored model
#   gemini-4-argon         43.2%   $ 8.21/task
#   gemini-3.8-flash       28.2%   $ 2.55/task
#   glm-5.2                25.3%   (median of all configs is 25.7%)
#   gemini-3.1-pro-preview 14.2%   (lowest of the sponsored models)
#   llama-4-maverick       <7%
#
# Model spread is ~50 points. For Opus the seven harnesses span 47.3%-50.6%
# (paper Table 3), so a harness can move a fixed model by single-digit points.
# This harness is declared on llama-4-maverick by request. The paper puts it
# below 7%, and the competition requires a mean of at least 0.138 to qualify for
# the Pareto frontier, so the declared model alone forfeits eligibility for
# prizes unless the harness adds more than seven points — more than the entire
# published harness spread. Develop on it cheaply if that is the goal, then
# switch this line to a stronger sponsored model before committing; the Overview
# states that switching model_api before committing does not disqualify you, as
# long as the model that produced artifacts/ is documented.
model_api: google-cloud/llama-4-maverick

install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt

serve: /opt/harness/venv/bin/python {src}/serve.py

env:
  LOG_LEVEL: "info"
  MAX_FIX_ROUNDS: "3"
  PLAYBOOK_PATH: "/tmp/playbook.jsonl"
  TELEMETRY_DIR: "/tmp/telemetry"
  PLE_GATE_MODE: "on"
